<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 512px;
            height: 512px;
            background-color: #695a6b;
        }
        .icon-container {
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo {
            max-width: 100%;
            max-height: 100%;
            filter: brightness(0) invert(1); /* Make SVG white */
        }
    </style>
</head>
<body>
    <div class="icon-container">
        <img src="../src/numu-logo-white.svg" alt="NUMU Logo" class="logo">
    </div>
</body>
</html>
